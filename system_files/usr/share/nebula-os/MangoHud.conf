### NebulaOS MangoHud preset
### Installed by `ujust nebula-fps-overlay on`; removed by `ujust nebula-fps-overlay off`.
### All options: /usr/share/doc/mangohud/MangoHud.conf.example
### Tweak it visually with MangoJuice.

legacy_layout=false
hud_compact

fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram

position=top-left
round_corners=8
background_alpha=0.4
font_size=20

# Deep Space palette: background, text, Nebula Blue, Cosmic Purple and Cyan.
background_color=090B14
text_color=F1F5F9
gpu_color=4263EB
cpu_color=805AD5
vram_color=22D3EE
ram_color=F1F5F9
engine_color=805AD5
io_color=22D3EE
frametime_color=22D3EE

# Show/hide the overlay in game: Right Shift + F12
toggle_hud=Shift_R+F12
