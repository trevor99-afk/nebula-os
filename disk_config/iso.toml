# Installer (ISO) settings for bootc-image-builder. Used by `just build-iso` and
# the "Build disk images" GitHub workflow.
#
# After installing, point the new system at the published image so it gets
# updates. The address is read from the image itself (/usr/share/nebula-os/image-ref,
# written at build time from REPO_ORGANIZATION and IMAGE_NAME in image-template.env),
# so this file never needs editing.
#
# The ISO is built from disk_config/installer.Containerfile, which adds Fedora's
# repository files for the installer; they are removed from the installed system.
[customizations.installer.kickstart]
contents = """
%post --erroronfail
rm -f /etc/yum.repos.d/fedora.repo /etc/yum.repos.d/fedora-updates.repo
# Follow the published image, with signature checking on from the start: updates must
# carry a valid cosign signature for /etc/pki/containers/nebula-os.pub (the policy for
# this image is in /etc/containers/policy.json, written by build_files/40-signing.sh).
# The installed system records "ostree-image-signed:docker://...". Before, it recorded
# "ostree-unverified-registry:..." until the user ran `ujust nebula-enable-signed-updates`.
# The policy's global default is "reject" (inherited from Universal Blue), which bootc
# requires for signature enforcement. If bootc still refuses, follow the image without
# enforcement (nebula doctor then reports unsigned updates and how to fix it). If even
# that fails, stop the install with an error: a system that cannot find its updates
# must not be finished silently (review of d155aea).
IMAGE_REF="$(cat /usr/share/nebula-os/image-ref)"
if ! bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry "$IMAGE_REF"; then
    echo "NebulaOS: could not turn on signature checking; updates stay unverified until 'ujust nebula-enable-signed-updates'." >&2
    if ! bootc switch --mutate-in-place --transport registry "$IMAGE_REF"; then
        echo "NebulaOS: could not set the update source $IMAGE_REF; stopping the installation." >&2
        exit 1
    fi
fi
# Name the computer. The installer leaves /etc/hostname empty (its Network module
# is off), and the boot then falls back to the base image's name, "bazzite"
# (seen in a VM install, 2026-11-22). DEFAULT_HOSTNAME is nebula-os or nebula-os-nvidia.
if ! grep -q '[^[:space:]]' /etc/hostname 2>/dev/null; then
    (. /usr/lib/os-release && echo "${DEFAULT_HOSTNAME:-nebula-os}") >/etc/hostname
fi
%end
"""

# The installer creates the user account and sets the time zone. Bazzite has no
# GNOME first-boot setup (gnome-initial-setup is not installed), so without the
# Users module the installed system had no account to log in with (tested in a VM,
# 2026-11-22).
[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]
