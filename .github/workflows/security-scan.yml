---
name: Security scan

# Weekly vulnerability scan of the published images with Trivy. Results show
# up in the repository's Security tab (code scanning); an SBOM (CycloneDX) is
# kept as a run artifact. Report-only: findings do not block builds, because
# most come from the Fedora/Bazzite base and are fixed upstream.
on:
  schedule:
    - cron: '30 6 * * 1'  # Mondays 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: [nebula-os, nebula-os-nvidia]
    steps:
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Image reference
        env:
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
        run: echo "IMAGE_REF=ghcr.io/${OWNER,,}/${IMAGE}:latest" >> "${GITHUB_ENV}"

      - name: Vulnerability scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          timeout: 45m

      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      - name: Software bill of materials (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: cyclonedx
          output: sbom-${{ matrix.image }}.cdx.json
          timeout: 45m

      - name: Keep the SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json
          retention-days: 30
