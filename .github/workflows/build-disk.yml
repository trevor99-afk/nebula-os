---
name: Build disk images

# Start it by hand: Actions tab > "Build disk images" > Run workflow.
# The installer ISO and VM image appear under "Artifacts" on the run's summary
# page for 7 days. Not yet tested by installing on real hardware: test the ISO
# in a virtual machine first (see docs/INSTALLATION.md).
on:
  workflow_dispatch:
    inputs:
      image:
        description: "Edition"
        type: choice
        options:
          - nebula-os
          - nebula-os-nvidia
        default: nebula-os
      tag:
        description: "Channel"
        type: choice
        options:
          - latest
          - testing
        default: latest
      upload-to-s3:
        description: "Upload to S3"
        required: false
        default: false
        type: boolean

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build disk images
    # Bazzite images are x86_64 only.
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        disk-type: ["qcow2", "anaconda-iso"]
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Prepare environment
        run: |
          {
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            echo "USER_UID=$(id -u)"
            echo "USER_GID=$(id -g)"
          } >> "${GITHUB_ENV}"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Free disk space
        run: df -h /

      # Ubuntu restricts unprivileged user namespaces with AppArmor. The image
      # builder's sandbox needs them; without this its mounts fail with
      # "permission denied" (run 45018113629). This runner is discarded after the job.
      - name: Allow the image builder's sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Prepare the source image
        env:
          SOURCE_IMAGE: ${{ env.IMAGE_REGISTRY }}/${{ inputs.image }}:${{ inputs.tag }}
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          sudo podman pull "${SOURCE_IMAGE}"
          if [[ "${DISK_TYPE}" == anaconda-iso ]]; then
            # The builder only reads /etc/yum.repos.d; see disk_config/installer.Containerfile.
            sudo podman build --pull=never --build-arg "BASE_IMAGE=${SOURCE_IMAGE}" \
              -t localhost/nebula-installer-source:latest -f disk_config/installer.Containerfile disk_config
            echo "BUILD_IMAGE=localhost/nebula-installer-source:latest" >> "${GITHUB_ENV}"
            echo "CONFIG_FILE=disk_config/iso.toml" >> "${GITHUB_ENV}"
          else
            echo "BUILD_IMAGE=${SOURCE_IMAGE}" >> "${GITHUB_ENV}"
            echo "CONFIG_FILE=disk_config/disk.toml" >> "${GITHUB_ENV}"
          fi

      - name: Build disk images
        env:
          DISK_TYPE: ${{ matrix.disk-type }}
        run: |
          mkdir -p output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            -v ./output:/output -v "./${CONFIG_FILE}:/config.toml:ro" \
            "${BIB_IMAGE}" --type "${DISK_TYPE}" --use-librepo=True "${BUILD_IMAGE}"
          sudo chown -R "${USER_UID}:${USER_GID}" output
          find output -type f -printf '%p %s bytes\n'

      - name: Upload disk images and Checksum to Job Artifacts
        if: inputs.upload-to-s3 != true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.image }}-${{ inputs.tag }}-${{ matrix.disk-type }}
          path: ./output
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Upload to S3
        if: inputs.upload-to-s3 == true
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ./output
          BUCKET: ${{ secrets.S3_BUCKET_NAME }}
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy "${SOURCE_DIR}" "S3:${BUCKET}"
