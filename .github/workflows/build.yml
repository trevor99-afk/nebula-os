---
name: Build container image
on:
  pull_request:
    branches:
      - main
      - dev
  schedule:
    - cron: '05 10 * * *'  # daily rebuild on the pinned base; new Bazzite releases arrive through update-base.yml
  push:
    branches:
      - main  # stable channel (tag: latest)
      - dev   # testing channel (tag: testing)
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"  # do not edit

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  # Only superseded pull request runs are cancelled; a run that publishes is never cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-26.04
    steps:
      # Action versions are pinned by commit SHA.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Just syntax
        run: just check

      - name: Shell scripts (shellcheck)
        run: just lint

      - name: Config files
        run: just validate

      - name: Unit tests (nebula tools)
        run: just test

      - name: Containerfile (hadolint)
        run: >
          docker run --rm -i
          docker.io/hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
          hadolint --failure-threshold error - < Containerfile

      - name: Workflows (actionlint)
        run: >
          docker run --rm -v "${PWD}:/repo:ro" -w /repo
          docker.io/rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  build_push:
    name: Build ${{ matrix.image_name }}
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Same NebulaOS code, two hardware editions.
          - image_name: nebula-os
            base_image: ghcr.io/ublue-os/bazzite-dx-gnome:stable
          - image_name: nebula-os-nvidia
            base_image: ghcr.io/ublue-os/bazzite-dx-nvidia-gnome:stable
    env:
      IMAGE_NAME: ${{ matrix.image_name }}
      BASE_IMAGE: ${{ matrix.base_image }}
      # The :stable name is recorded in the image (for `ujust nebula-switch-to-bazzite`); the build
      # itself uses the reviewed, signature-verified digest from base-images.lock.
      BASE_IMAGE_NAME: ${{ matrix.base_image }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Prepare environment
        run: |
          {
            # Lowercase the image uri https://github.com/macbre/push-to-ghcr/issues/12
            echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}"
            # Bake the real GitHub owner into the image (update address and signature policy).
            echo "REPO_ORGANIZATION=${GITHUB_REPOSITORY_OWNER,,}"
            # Channels: main publishes stable (latest), dev publishes testing.
            if [[ "${GITHUB_REF}" == "refs/heads/dev" ]]; then
              echo "DEFAULT_TAG=testing"
            else
              echo "DEFAULT_TAG=latest"
            fi
            if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && ( "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_REF}" == "refs/heads/dev" ) ]]; then
              echo "PUBLISH=true"
            else
              echo "PUBLISH=false"
            fi
          } >> "${GITHUB_ENV}"

      # Build only from a reviewed Bazzite digest whose Universal Blue signature verifies, so a
      # changed or tampered upstream image is never built and signed as NebulaOS (security review
      # and red team, 2026-11-23). cosign 3 needs --new-bundle-format=false for these signatures.
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'

      - name: Verify the pinned Bazzite base image
        run: |
          repo="${BASE_IMAGE%:*}"
          pinned=$(awk -v r="$repo" -F@ '$1 == r && $2 ~ /^sha256:[0-9a-f]{64}$/ {print; exit}' base-images.lock)
          if [[ -z "$pinned" ]]; then
            echo "::error::base-images.lock has no reviewed digest for ${repo}"
            exit 1
          fi
          cosign verify --new-bundle-format=false --key keys/ublue-os.pub "$pinned" > /dev/null
          echo "Verified ${pinned} with Universal Blue's key."
          echo "BASE_IMAGE_PINNED=${pinned}" >> "${GITHUB_ENV}"

      - name: Build image
        env:
          BASE_IMAGE: ${{ env.BASE_IMAGE_PINNED }}
        run: just build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Nothing is published unless the built image passes these tests.
      - name: Test image
        run: just test-image "${IMAGE_NAME}" "${DEFAULT_TAG}"

      # Smaller delta updates for users.
      # Rechunking runs a privileged container from the built image, so pull
      # requests (untrusted code) skip it: it only matters for published images.
      - name: Rechunk with rpm-ostree
        if: env.PUBLISH == 'true'
        run: just ostree-rechunk "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Generate build tags
        id: tags
        run: |
          tags="$(just generate-build-tags "${IMAGE_NAME}" "${DEFAULT_TAG}")"
          echo "Tags: ${tags}"
          echo "tags=${tags}" >> "${GITHUB_OUTPUT}"

      - name: Tag image
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.tags }}
        run: just tag-images "${IMAGE_NAME}" "${DEFAULT_TAG}" "${ALIAS_TAGS}"

      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Push the dated/commit tags first. The channel tag users follow is only
      # moved after the image is signed and the signature verified.
      - name: Push versioned tags
        if: env.PUBLISH == 'true'
        id: push
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          read -r -a tags <<< "${ALIAS_TAGS}"
          for tag in "${tags[@]:0:${#tags[@]}-1}"; do
            podman push --digestfile=/tmp/digestfile "${IMAGE_NAME}:${tag}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "${GITHUB_OUTPUT}"

      # Signing: the SIGNING_SECRET repository secret holds cosign.key (see README).
      - name: Install Cosign
        if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          # be careful when upgrading major versions
          cosign-release: 'v3.1.4'

      - name: Sign image
        if: env.PUBLISH == 'true'
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          # https://github.com/containers/container-libs/issues/388
          # https://github.com/coreos/rpm-ostree/issues/5509
          # use old bundle format, so we can use newer cosign 3.X.X instead of 2.X.X
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify signature
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign verify --key cosign.pub "${IMAGE_REGISTRY}/${IMAGE_NAME}@${DIGEST}" > /dev/null

      - name: Publish channel tag
        if: env.PUBLISH == 'true'
        env:
          ALIAS_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          channel="${ALIAS_TAGS##* }"
          podman push "${IMAGE_NAME}:${channel}" "${IMAGE_REGISTRY}/${IMAGE_NAME}:${channel}"
          echo "Published ${IMAGE_REGISTRY}/${IMAGE_NAME}:${channel}"
